<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Info | LUXURY PARKING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .info-container {
            max-width: 600px;
            margin: 100px auto;
            background: var(--panel-bg);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            backdrop-filter: blur(10px);
            animation: popIn 0.5s ease-out forwards;
        }

        .info-header {
            text-align: center;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .info-header h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            margin: 0;
            letter-spacing: 2px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-label {
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .back-btn {
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            border-radius: 4px;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .back-btn:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="info-container">
        <div class="info-header">
            <h2>PERSONAL INFORMATION</h2>
        </div>

        <div class="info-row">
            <span class="info-label">Full Name</span>
            <span class="info-value">{{ session.get('name', 'N/A') }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Email (User ID)</span>
            <span class="info-value">{{ session.get('email', 'N/A') }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Phone Number</span>
            <span class="info-value">{{ session.get('phone', 'N/A') }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">Account Type</span>
            <span class="info-value" style="color: var(--primary);">{{ session.get('role', 'User') | upper }}</span>
        </div>

        <a href="/" class="back-btn">RETURN TO DASHBOARD</a>
    </div>
</body>
</html>
