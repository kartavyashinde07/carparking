<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="N-Park Supreme – Smart parking booking. Find and reserve nearby parking slots instantly.">
    <title>Login | N-PARK SUPREME</title>

    <!-- Inter (body) + Orbitron (logo) — loaded correctly before style.css -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap&font-display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="index-body">

    <!-- Static full-screen hero background -->
    <div class="hero-bg"></div>
    <!-- Dark overlay for readability -->
    <div class="hero-overlay"></div>

    <!-- Centered login card -->
    <div class="login-wrapper" id="login-wrapper">
        <div class="login-box">
            <div class="login-header">
                <h2>SYSTEM ACCESS</h2>
                <div class="line"></div>
            </div>

            <form method="POST" action="/login">

                <div class="input-group">
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           autocomplete="off">
                    <label for="username">CUSTOMER ID</label>
                    <div class="bar"></div>
                </div>

                <div class="input-group" style="position:relative;">
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           autocomplete="off">
                    <label for="password">PASSWORD</label>
                    <div class="bar"></div>
                    <span id="toggle-pw"
                          onclick="togglePassword()"
                          title="Toggle password visibility">👁</span>
                </div>

                <button type="submit" class="login-btn" id="login-submit-btn">
                    <span>INITIALIZE ENGINE</span>
                </button>

                <div class="auth-links">
                    <a href="/register" id="link-register">CREATE ACCOUNT</a>
                    <span class="auth-sep">|</span>
                    <a href="/partner_register" id="link-partner" class="partner-link">PARTNER ONBOARDING</a>
                </div>

            </form>

            {% if error %}
            <div class="error-msg" id="error-msg">
                {{ error }}
            </div>
            {% endif %}

        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
